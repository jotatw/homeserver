# HomeServer — tarefas agendadas
# Formato: nome|OnCalendar|comando|persistent
# persistent=true  -> roda o evento perdido ao religar (ex.: backup)
# persistent=false -> NÃO roda catch-up (ex.: desligamento)

backup|*-*-* 03:00:00|bash /srv/scripts/backup.sh|true
night-off|*-*-* 22:00:00|bash /srv/scripts/power-schedule.sh|false
tls-renew|Sun *-*-* 04:00:00|bash /srv/scripts/tls-renew.sh|true
