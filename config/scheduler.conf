# HomeServer — tarefas agendadas
# Formato: nome|OnCalendar|comando|persistent
# persistent=true  -> roda o evento perdido ao religar (ex.: backup)
# persistent=false -> NÃO roda catch-up (ex.: desligamento)
#
# Nota: o servidor suspende à noite (night-off S3, ~23:30→07:00). Durante
# o S3 os timers systemd NÃO disparam — por isso as tarefas diárias ficam
# FORA dessa janela (após as 07:00).

backup|*-*-* 07:30:00|bash /srv/scripts/backup.sh|true
night-off|*-*-* 23:30:00|bash /srv/scripts/power-schedule.sh|false
tls-renew|Sun *-*-* 08:00:00|bash /srv/scripts/tls-renew.sh|true
service-watchdog|*-*-* *:00/15:00|bash /srv/git/homeserver/scripts/service-watchdog.sh|false
backup-check|*-*-* 08:30:00|bash /srv/git/homeserver/scripts/backup-check.sh|true
