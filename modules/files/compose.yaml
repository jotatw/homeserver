services:
  filebrowser:

    # Imagem (FileBrowser Quantum) — pinada; atualizar com
    # `hs service update files` após bumpar a tag aqui.
    image: gtstef/filebrowser:1.5.6-stable-slim

    container_name: files
    hostname: files

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:
      TZ: 
      FILEBROWSER_ADMIN_PASSWORD: 

    ports:
      - "8080:80"

    volumes:
      - /srv/storage:/srv
      # Config de runtime: o config.yaml versionado (modules/files/config.yaml)
      # é a referência; copie para /srv/services/files/config/ ao implantar.
      - /srv/services/files/config:/home/filebrowser/data

    networks:
      - homeserver

networks:
  homeserver:
    external: true
