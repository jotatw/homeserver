services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2

    container_name: homepage

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    user: "${PUID:-1000}:${PGID:-1000}"

    group_add:
      - "${PGID:-1000}"

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-homeserver.local}
      HOMEPAGE_AUTH_ENABLED: ${HOMEPAGE_AUTH_ENABLED:-false}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET:-}
      HOMEPAGE_EXTERNAL_URL: ${HOMEPAGE_EXTERNAL_URL:-}
      HOMEPAGE_OIDC_ISSUER: ${HOMEPAGE_OIDC_ISSUER:-}
      HOMEPAGE_OIDC_CLIENT_ID: ${HOMEPAGE_OIDC_CLIENT_ID:-}
      HOMEPAGE_OIDC_CLIENT_SECRET: ${HOMEPAGE_OIDC_CLIENT_SECRET:-}
      HOMEPAGE_VAR_API_TOKEN: ${HOMEPAGE_VAR_API_TOKEN:-}
      HOMEPAGE_VAR_HERMES_KEY: ${HOMEPAGE_VAR_HERMES_KEY:-}

    ports:
      - "3000:3000"

    volumes:
      - ./config:/app/config
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - homeserver

networks:
  homeserver:
    external: true
