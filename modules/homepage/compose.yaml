services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest

    container_name: homepage

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    group_add:
      - "989"

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.10:3000,homeserver.local
      HOMEPAGE_AUTH_ENABLED: ${HOMEPAGE_AUTH_ENABLED:-false}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET:-}
      HOMEPAGE_EXTERNAL_URL: ${HOMEPAGE_EXTERNAL_URL:-}
      HOMEPAGE_OIDC_ISSUER: ${HOMEPAGE_OIDC_ISSUER:-}
      HOMEPAGE_OIDC_CLIENT_ID: ${HOMEPAGE_OIDC_CLIENT_ID:-}
      HOMEPAGE_OIDC_CLIENT_SECRET: ${HOMEPAGE_OIDC_CLIENT_SECRET:-}

    ports:
      - "3000:3000"

    volumes:
      - ./config:/app/config
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - homeserver

networks:
  homeserver:
    external: true
