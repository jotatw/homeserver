title: HomeServer
description: Hub central do servidor doméstico
language: pt-BR

theme: dark
color: slate

target: _blank
headerStyle: boxed
fullWidth: true
statusStyle: dot
showStats: true
useEqualHeights: true

hideVersion: true
disableUpdateCheck: true
disableIndexing: true
hideErrors: true

quicklaunch:
  searchDescriptions: true
  hideVisitURL: true
  provider: duckduckgo

layout:
  Arquivos:
    style: row
    columns: 4
  Projetos:
    style: row
    columns: 4
  Downloads:
    style: row
    columns: 4
  Mídia:
    style: row
    columns: 4
  Serviços:
    style: row
    columns: 4
  Gestão:
    style: row
    columns: 2
  Manutenção:
    style: row
    columns: 4
  Links:
    style: row
    columns: 6
