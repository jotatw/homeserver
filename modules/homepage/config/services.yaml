---
- Essenciais:

    - Homepage:
        icon: mdi-home
        href: http://192.168.0.10:3000
        description: Dashboard do servidor
        server: homeserver
        container: homepage

    - FileBrowser:
        icon: mdi-folder-open
        href: http://192.168.0.10:8080
        description: Gerenciador de arquivos
        server: homeserver
        container: filebrowser

    - Gitea:
        icon: sh-gitea
        href: http://192.168.0.10:3001
        description: Repositórios Git
        server: homeserver
        container: gitea

    - API:
        icon: mdi-code-tags
        href: http://192.168.0.10:8000/api/v1/status
        description: API do HomeServer
        server: homeserver
        container: api-api-1

- Status:

    - Server:
        id: server-status
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          mappings:
            - field: hostname
              label: Hostname
            - field: os
              label: Sistema
            - field: uptime
              label: Uptime
            - field: cpu.percent
              label: CPU
              format: percent
            - field: memory.percent
              label: Memória
              format: percent
            - field: disk.percent
              label: Disco
              format: percent
            - field: backup
              label: Backup

- Administração:

    - Portainer:
        icon: sh-portainer
        href: https://192.168.0.10:9443
        description: Módulo opcional (desativado)
        server: homeserver
        container: portainer

    - Gitea SSH:
        icon: sh-git
        href: ssh://git@192.168.0.10:2222
        description: Acesso Git via SSH
        server: homeserver
        container: gitea

- Sistema:

    - Serviços:
        icon: mdi-server-network
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: services
            name: name
            label: status

    - Usuários:
        icon: mdi-account-group
        href: http://192.168.0.10:8000/api/v1/users
        description: Gestão de usuários (API)

    - Backup:
        icon: mdi-backup-restore
        href: http://192.168.0.10:8000/api/v1/status
        description: Último backup e estado
