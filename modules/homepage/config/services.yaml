---
# Modo Usuário — conteúdo
- Favoritos:

    - FileBrowser:
        icon: mdi-folder-open
        href: /files/
        description: Arquivos

    - Gitea:
        icon: sh-gitea
        href: /git/
        description: Projetos e repositórios

    - Projetos:
        icon: mdi-code-tags
        href: /git/
        description: Meus projetos

    - Downloads:
        icon: mdi-download
        href: /files/
        description: Downloads

- Arquivos:

    - Meus Arquivos:
        icon: mdi-folder
        href: /files/
        description: Acesse seus arquivos
        widget:
          type: customapi
          url: http://api:8000/api/v1/storage
          refreshInterval: 30000
          mappings:
            - field: total_size_human
              label: Utilizado

- Projetos:

    - Projetos:
        icon: mdi-code-tags
        href: /git/
        description: Projetos e repositórios

- Downloads:

    - Downloads:
        icon: mdi-download
        href: /files/
        description: Área de downloads

- Mídia:

    - Mídia:
        icon: mdi-movie
        href: /files/#/media
        description: Arquivos de mídia

# Modo Administrador — serviços e gestão
- Serviços:

    - Homepage:
        icon: mdi-home
        href: /
        server: homeserver
        container: homepage

    - FileBrowser:
        icon: mdi-folder-open
        href: /files/
        server: homeserver
        container: filebrowser

    - Gitea:
        icon: sh-gitea
        href: /git/
        server: homeserver
        container: gitea

    - API:
        icon: mdi-api
        href: /api/v1/status
        server: homeserver
        container: api-api-1

- Gestão:

    - Usuários:
        icon: mdi-account-group
        href: /files/
        description: Gerencie usuários e permissões

    - Storage:
        id: storage-status
        icon: mdi-harddisk
        widget:
          type: customapi
          url: http://api:8000/api/v1/storage
          refreshInterval: 30000
          mappings:
            - field: ready
              label: Pronto
              remap:
                - value: true
                  to: Sim
                - value: false
                  to: Não
            - field: users
              label: Usuários
            - field: shared
              label: Compartilhado
            - field: media
              label: Mídia
            - field: documents
              label: Documentos

# Modo Sistema — manutenção
- Manutenção:

    - Hoje:
        icon: mdi-calendar-today
        widget:
          type: customapi
          url: http://api:8000/api/v1/events
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            name: time
            label: action

    - Serviços:
        icon: mdi-server-network
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: services
            name: name
            label: status

    - Dispositivos:
        id: devices-preview
        icon: mdi-usb
        widget:
          type: customapi
          url: http://api:8000/api/v1/devices
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            name: label
            label: type

    - Sensores:
        icon: mdi-thermometer
        widget:
          type: customapi
          url: http://api:8000/api/v1/hardware
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: temperature
            name: label
            label: temp

    - Agendamento:
        id: power-schedule
        icon: mdi-power-settings
        widget:
          type: customapi
          url: http://api:8000/api/v1/power
          refreshInterval: 30000
          mappings:
            - field: shutdown
              label: Desliga
            - field: wake
              label: Liga
            - field: enabled
              label: Ativo

    - Server:
        id: server-status
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          mappings:
            - field: hostname
              label: Hostname
            - field: os
              label: Sistema
            - field: uptime
              label: Uptime
            - field: cpu.percent
              label: CPU
              format: percent
            - field: memory.percent
              label: Memória
              format: percent
            - field: disk.percent
              label: Disco
              format: percent
            - field: backup
              label: Backup
            - field: wol
              label: Wake-on-LAN
