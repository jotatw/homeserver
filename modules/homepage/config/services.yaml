---
# HomeServer v1.4 — Homepage como portal
#
# Grupos: Meu espaço · Aplicações · Administração · Sistema
# Widgets técnicos ficam apenas em Sistema (sem redundância).

# Modo Usuário e Administrador — tarefas do usuário
- Meu espaço:

    - Arquivos:
        icon: mdi-folder
        href: /files/
        description: Acesse seus arquivos

    - Projetos:
        icon: mdi-code-tags
        href: /git/
        description: Meus projetos

    - Downloads:
        icon: mdi-download
        href: /files/
        description: Área de downloads

    - Mídia:
        icon: mdi-movie
        href: /files/#/media
        description: Arquivos de mídia

# Aplicações — destinos do usuário (apenas status)
- Aplicações:

    - Homepage:
        icon: mdi-home
        href: /
        server: homeserver
        container: homepage

    - FileBrowser:
        icon: mdi-folder-open
        href: /files/
        server: homeserver
        container: filebrowser

    - Gitea:
        icon: sh-gitea
        href: /git/
        server: homeserver
        container: gitea

    - HomeServer App:
        icon: mdi-monitor-dashboard
        href: /app
        server: homeserver
        container: api-api-1
        description: Administração da plataforma

# Modo Administrador — gestão
- Administração:

    - Usuários:
        icon: mdi-account-group
        href: /app
        description: Gerencie usuários e permissões

    - Storage:
        id: storage-status
        icon: mdi-harddisk
        href: /files/
        description: Armazenamento

    - Backups:
        icon: mdi-backup-restore
        href: /app
        description: Cópias de segurança

    - Agendamentos:
        id: power-schedule
        icon: mdi-power-settings
        description: Liga e desliga automático

# Modo Sistema — diagnóstico técnico
- Sistema:

    - Serviços:
        icon: mdi-server-network
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer f45136cd97a35d901fdd370595077d5586125612b0a402b5
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: services
            name: name
            label: status

    - Sensores:
        icon: mdi-thermometer
        widget:
          type: customapi
          url: http://api:8000/api/v1/hardware
          headers:
            Authorization: Bearer f45136cd97a35d901fdd370595077d5586125612b0a402b5
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: temperature
            name: label
            label: temp

    - Dispositivos:
        id: devices-preview
        icon: mdi-usb
        widget:
          type: customapi
          url: http://api:8000/api/v1/devices
          headers:
            Authorization: Bearer f45136cd97a35d901fdd370595077d5586125612b0a402b5
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            name: label
            label: type

    - Armazenamento:
        icon: mdi-harddisk
        widget:
          type: customapi
          url: http://api:8000/api/v1/storage
          headers:
            Authorization: Bearer f45136cd97a35d901fdd370595077d5586125612b0a402b5
          refreshInterval: 30000
          mappings:
            - field: ready
              label: Pronto
              remap:
                - value: true
                  to: Sim
                - value: false
                  to: Não
            - field: users
              label: Usuários
            - field: shared
              label: Compartilhado
            - field: media
              label: Mídia
            - field: documents
              label: Documentos
            - field: total_size_human
              label: Utilizado

    - Eventos:
        icon: mdi-calendar-today
        widget:
          type: customapi
          url: http://api:8000/api/v1/events
          headers:
            Authorization: Bearer f45136cd97a35d901fdd370595077d5586125612b0a402b5
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            name: time
            label: action

    - Servidor:
        id: server-status
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer f45136cd97a35d901fdd370595077d5586125612b0a402b5
          refreshInterval: 30000
          mappings:
            - field: hostname
              label: Hostname
            - field: os
              label: Sistema
            - field: uptime
              label: Uptime
            - field: cpu.percent
              label: CPU
              format: percent
            - field: memory.percent
              label: Memória
              format: percent
            - field: disk.percent
              label: Disco
              format: percent
            - field: backup
              label: Backup
            - field: wol
              label: Wake-on-LAN
