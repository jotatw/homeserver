---
# Modo Usuário — conteúdo
- Arquivos:

    - Meus Arquivos:
        icon: mdi-folder
        href: http://192.168.0.10:8080
        description: Acesse seus arquivos

- Projetos:

    - Projetos:
        icon: mdi-code-tags
        href: http://192.168.0.10:3001
        description: Projetos e repositórios

- Downloads:

    - Downloads:
        icon: mdi-download
        href: http://192.168.0.10:8080
        description: Área de downloads

- Mídia:

    - Mídia:
        icon: mdi-movie
        href: http://192.168.0.10:8080/#/media
        description: Arquivos de mídia

# Modo Administrador — serviços e gestão
- Serviços:

    - Homepage:
        icon: mdi-home
        href: http://192.168.0.10:3000
        server: homeserver
        container: homepage

    - FileBrowser:
        icon: mdi-folder-open
        href: http://192.168.0.10:8080
        server: homeserver
        container: filebrowser

    - Gitea:
        icon: sh-gitea
        href: http://192.168.0.10:3001
        server: homeserver
        container: gitea

    - API:
        icon: mdi-api
        href: http://192.168.0.10:8000/api/v1/status
        server: homeserver
        container: api-api-1

- Gestão:

    - Usuários:
        icon: mdi-account-group
        href: http://192.168.0.10:8080
        description: Gerencie usuários e permissões

    - Storage:
        id: storage-status
        icon: mdi-harddisk
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          mappings:
            - field: storage.ready
              label: Pronto
            - field: storage.users
              label: Usuários
              format: size
            - field: storage.shared
              label: Compartilhado
              format: size
            - field: storage.media
              label: Mídia
              format: size

# Modo Sistema — manutenção
- Manutenção:

    - Serviços:
        icon: mdi-server-network
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: services
            name: name
            label: status

    - Sensores:
        icon: mdi-thermometer
        widget:
          type: customapi
          url: http://api:8000/api/v1/hardware
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: temperature
            name: label
            label: temp

    - Server:
        id: server-status
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          refreshInterval: 30000
          mappings:
            - field: hostname
              label: Hostname
            - field: os
              label: Sistema
            - field: uptime
              label: Uptime
            - field: cpu.percent
              label: CPU
              format: percent
            - field: memory.percent
              label: Memória
              format: percent
            - field: disk.percent
              label: Disco
              format: percent
            - field: backup
              label: Backup
            - field: wol
              label: Wake-on-LAN
