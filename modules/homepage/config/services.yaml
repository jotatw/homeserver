---
# HomeServer v1.4 — Homepage como portal
#
# Grupos: Meu espaço · Aplicações · Administração · Sistema
# Cards como ações: título = tarefa, descrição = o que fazer.
# Widgets técnicos ficam apenas em Sistema.

# Meu espaço — tarefas do usuário (cards principais, destacados)
- Meu espaço:

    - Assistente IA:
        icon: mdi-robot
        href: http://100.118.148.55:3002
        description: Hermes Remote (chat + dashboard)

    - Arquivos:
        icon: mdi-folder
        href: /files/
        description: Gerenciar arquivos

    - Projetos:
        icon: mdi-code-tags
        href: /git/
        description: Abrir Gitea

    - Downloads:
        icon: mdi-download
        href: /files/
        description: Receber arquivos

    - Mídia:
        icon: mdi-movie
        href: /files/#/media
        description: Assistir e ouvir

# Aplicações — destinos do usuário (apenas status)
- Aplicações:

    - Homepage:
        icon: mdi-home
        href: /
        server: homeserver
        container: homepage

    - Files:
        icon: mdi-folder-open
        href: /files/
        server: homeserver
        container: files

    - Gitea:
        icon: sh-gitea
        href: /git/
        server: homeserver
        container: gitea

    - Hermes Remote:
        icon: mdi-robot-outline
        href: http://100.118.148.55:3002
        description: Assistente IA

    - HomeServer App:
        icon: mdi-monitor-dashboard
        href: /app
        server: homeserver
        container: api-api-1
        description: Abrir o App

# Administração — gestão (modo Administrador)
- Administração:

    - Usuários:
        icon: mdi-account-group
        href: /app
        description: Gerenciar pessoas

    - Storage:
        id: storage-status
        icon: mdi-harddisk
        href: /files/
        description: Ver armazenamento

    - Backups:
        icon: mdi-backup-restore
        href: /app
        description: Cópias de segurança

    - Agendamentos:
        id: power-schedule
        icon: mdi-power-settings
        description: Liga e desliga automático

# Sistema — diagnóstico técnico (modo Sistema)
- Sistema:

    - Serviços:
        icon: mdi-server-network
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: data.services
            name: name
            label: status

    - Sensores:
        icon: mdi-thermometer
        widget:
          type: customapi
          url: http://api:8000/api/v1/hardware
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data.temperature
            name: label
            label: temp

    - Dispositivos:
        id: devices-preview
        icon: mdi-usb
        widget:
          type: customapi
          url: http://api:8000/api/v1/devices
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            name: label
            label: type

    - Armazenamento:
        icon: mdi-harddisk
        widget:
          type: customapi
          url: http://api:8000/api/v1/storage
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.ready
              label: Pronto
              remap:
                - value: true
                  to: Sim
                - value: false
                  to: Não
            - field: data.users
              label: Usuários
            - field: data.shared
              label: Compartilhado
            - field: data.media
              label: Mídia
            - field: data.documents
              label: Documentos
            - field: data.total_size_human
              label: Utilizado

    - Eventos:
        icon: mdi-calendar-today
        widget:
          type: customapi
          url: http://api:8000/api/v1/events
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            name: time
            label: action

    - Hermes IA:
        icon: mdi-robot
        widget:
          type: customapi
          url: http://172.19.0.1:8642/v1/models
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_HERMES_KEY}}
          refreshInterval: 60000
          mappings:
            - field: data.data
              label: Modelos
            - field: data.object
              label: API
    - Servidor:
        id: server-status
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.hostname
              label: Hostname
            - field: data.os
              label: Sistema
            - field: data.uptime
              label: Uptime
            - field: data.cpu.percent
              label: CPU
              format: percent
            - field: data.memory.percent
              label: Memória
              format: percent
            - field: data.disk.percent
              label: Disco
              format: percent
            - field: data.backup
              label: Backup
            - field: data.wol
              label: Wake-on-LAN
