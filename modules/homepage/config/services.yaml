---
# HomeServer v2 — Homepage como portal com tabs nativas.
#
# Tabs: Meu espaço · Aplicações · Administração · Sistema
# (mapeadas em settings.yaml via layout.<grupo>.tab)
#
# Personalização: reordenar/ocultar blocos editando este arquivo —
# a ordem das entradas define a ordem na página. Ver ADR-005
# (docs/design/ADR-005-design-system-minimal.md).
#
# Hermes Remote é complemento externo e NÃO aparece no portal (ADR-005).

# Meu espaço — atalhos do usuário (tab inicial)
- Meu espaço:

    - Recursos:
        id: dash-resources
        icon: mdi-speedometer
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.cpu.percent
              label: CPU
              format: percent
            - field: data.memory.percent
              label: Memória
              format: percent
            - field: data.disk.percent
              label: Disco
              format: percent

    - Arquivos:
        icon: mdi-folder
        href: /files/
        description: Gerenciar arquivos

    - Projetos:
        icon: mdi-code-tags
        href: /git/
        description: Abrir Gitea

    - Downloads:
        icon: mdi-download
        href: /files/
        description: Receber arquivos

    - Mídia:
        icon: mdi-movie
        href: /files/#/media
        description: Assistir e ouvir

    - Servidor:
        id: dash-server
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.uptime
              label: Uptime
            - field: data.cpu.percent
              label: CPU
              format: percent
            - field: data.memory.percent
              label: Memória
              format: percent

    - Armazenamento:
        id: dash-storage
        icon: mdi-harddisk
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.disk.percent
              label: Disco
              format: percent
            - field: data.storage.total_size_human
              label: Utilizado

    - Backups:
        id: dash-backup
        icon: mdi-backup-restore
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 60000
          mappings:
            - field: data.backup
              label: Último

    - Energia:
        id: dash-power
        icon: mdi-power-settings
        widget:
          type: customapi
          url: http://api:8000/api/v1/power/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 60000
          mappings:
            - field: data.shutdown
              label: Desligar
            - field: data.wake
              label: Ligar
            - field: data.enabled
              label: Ativo
              remap:
                - value: true
                  to: Sim
                - value: false
                  to: Não

# Aplicações — serviços oficiais com status Docker (tab 2)
- Aplicações:

    - Homepage:
        icon: mdi-home
        href: /
        server: homeserver
        container: homepage

    - Files:
        icon: mdi-folder-open
        href: /files/
        server: homeserver
        container: files

    - Gitea:
        icon: sh-gitea
        href: /git/
        server: homeserver
        container: gitea

    - HomeServer App:
        icon: mdi-monitor-dashboard
        href: /app
        server: homeserver
        container: api-api-1
        description: Abrir o App

# Administração — destinos de gestão (tab 3)
- Administração:

    - Usuários:
        icon: mdi-account-group
        href: /app/#/admin
        description: Gerenciar pessoas

    - Storage:
        icon: mdi-harddisk
        href: /app/#/storage
        description: Ver armazenamento

    - Backups:
        icon: mdi-backup-restore
        href: /app/#/admin
        description: Cópias de segurança

    - Agendamentos:
        id: power-schedule
        icon: mdi-power-settings
        description: Liga e desliga automático

# Sistema — widgets técnicos (tab 4)
- Sistema:

    - Serviços:
        icon: mdi-server-network
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            items: data.services
            name: name
            label: status

    - Sensores:
        icon: mdi-thermometer
        widget:
          type: customapi
          url: http://api:8000/api/v1/hardware/sensors
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data.temperature
            name: label
            label: temp

    - Dispositivos:
        id: devices-preview
        icon: mdi-usb
        widget:
          type: customapi
          url: http://api:8000/api/v1/devices
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 15000
          display: dynamic-list
          mappings:
            name: label
            label: type

    - Armazenamento detalhado:
        icon: mdi-harddisk
        widget:
          type: customapi
          url: http://api:8000/api/v1/storage
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.ready
              label: Pronto
              remap:
                - value: true
                  to: Sim
                - value: false
                  to: Não
            - field: data.users
              label: Usuários
            - field: data.shared
              label: Compartilhado
            - field: data.media
              label: Mídia
            - field: data.documents
              label: Documentos
            - field: data.total_size_human
              label: Utilizado

    - Eventos:
        icon: mdi-calendar-today
        widget:
          type: customapi
          url: http://api:8000/api/v1/events
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          display: dynamic-list
          mappings:
            name: time
            label: action

    - Servidor:
        id: server-status
        icon: mdi-server
        widget:
          type: customapi
          url: http://api:8000/api/v1/status
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_API_TOKEN}}
          refreshInterval: 30000
          mappings:
            - field: data.hostname
              label: Hostname
            - field: data.os
              label: Sistema
            - field: data.uptime
              label: Uptime
            - field: data.cpu.percent
              label: CPU
              format: percent
            - field: data.memory.percent
              label: Memória
              format: percent
            - field: data.disk.percent
              label: Disco
              format: percent
            - field: data.backup
              label: Backup
            - field: data.wol
              label: Wake-on-LAN
