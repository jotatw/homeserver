services:
  caddy:
    # Pinada na versão em uso (2.11.4). Nota: o Caddyfile força HTTP/1.1
    # (workaround p/ streams h2 concorrentes derrubados no 2.11) — ao
    # subir versão, revalidar os widgets do portal antes de remover o bloco.
    image: caddy:2.11.4

    container_name: caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      - LAN_IP=${HS_HOST_IP:-192.168.0.10}
      # Token de serviço injetado em GETs anônimos de telemetria (Caddyfile
      # @api_anon_get). Definido em modules/caddy/.env no servidor (não versionado).
      - API_SERVICE_TOKEN=${API_SERVICE_TOKEN:-}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/config/tls:/etc/tls:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - homeserver

volumes:
  caddy_data:
  caddy_config:

networks:
  homeserver:
    external: true
