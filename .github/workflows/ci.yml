name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: find core -name "*.sh" -exec shellcheck -S warning {} +

      # Unit tests (Foundation + Infrastructure) — sem servidor.
      # A integração (Smoke/CLI/Session/API) roda em pós-deploy via
      # core/tests/run_ci.sh (precisa do servidor real).
      - name: Run unit test suite
        run: bash core/tests/run_all.sh

  api:
    name: API (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Session unit tests
        run: npm run test:session
