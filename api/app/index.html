<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>HomeServer App</title>
  <link rel="manifest" href="/app/manifest.json">
  <link rel="icon" type="image/png" href="/app/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/app/assets/icon-192.png">
  <link rel="stylesheet" href="/app/css/theme.css">
  <link rel="stylesheet" href="/app/css/style.css">
  <link rel="stylesheet" href="/app/css/responsive.css">
</head>
<body>
  <div class="app-shell" id="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> HomeServer</div>
      <nav id="sidebar-nav"></nav>
      <div class="spacer"></div>
      <div class="avatar" id="sidebar-user" style="margin:var(--hs-space-1) var(--hs-space-2)"></div>
      <button class="nav-item" id="btn-theme"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span> Tema</button>
      <button class="nav-item" id="btn-sair"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></span> Sair</button>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <h1 id="topbar-title"></h1>
        <div class="topbar-actions">
          <button class="nav-item" id="btn-theme-mobile" aria-label="Alternar tema"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></button>
          <div class="avatar" id="topbar-user"></div>
        </div>
      </header>
      <div id="toast-region" role="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>

    <nav class="bottomnav" id="bottom-nav" aria-label="Principal"></nav>
  </div>
  <script src="/app/js/auth.js"></script>
  <script src="/app/js/app.js"></script>
  <script src="/app/js/store.js"></script>
  <script src="/app/js/dashboard-widgets.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/app/sw.js");
    }
  </script>
</body>
</html>
