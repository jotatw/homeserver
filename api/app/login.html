<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Entrar — HomeServer</title>
  <link rel="stylesheet" href="/app/theme.css">
  <link rel="stylesheet" href="/app/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="logo">● HomeServer</div>
      <p class="subtitle">Entre para acessar seu servidor</p>

      <form id="login-form">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" id="btn-login" type="submit">Entrar</button>
      </form>

      <p class="host" id="login-host"></p>
    </div>
  </div>
  <script src="/app/auth.js"></script>
  <script src="/app/login.js"></script>
</body>
</html>
